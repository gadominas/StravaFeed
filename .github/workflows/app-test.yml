# The app test runs on every push: the real script in the Scriptable emulator from gadominas/app-blueprints (repo-site),
# against a pretend strava.com, Claude and OpenAI (tests/README.md lists what it covers).
# app-blueprints is private: the APP_BLUEPRINTS_TOKEN secret (a token that can read it) lets the checkout through.
name: App test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-24.04   # Playwright's browser dependencies are published for this release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { path: StravaFeed }
      - uses: actions/checkout@v5
        with: { repository: gadominas/app-blueprints, path: app-blueprints, token: '${{ secrets.APP_BLUEPRINTS_TOKEN }}' }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Emulator dependencies
        working-directory: app-blueprints/repo-site
        run: |
          npm ci
          npm install --no-save playwright@1.56.0
      - name: Headless Chromium
        working-directory: app-blueprints/repo-site
        run: npx playwright install --with-deps chromium
      - name: App tests (sections 0 to 16)
        working-directory: StravaFeed
        env:
          APP_BLUEPRINTS: ${{ github.workspace }}/app-blueprints
        run: node tests/app.test.js
