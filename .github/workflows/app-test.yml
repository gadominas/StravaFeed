# Logging in and out and posting comments must always work: the app test runs on every push.
# It runs the real script in the Scriptable emulator from gadominas/app-blueprints (repo-site).
name: App test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-24.04   # Playwright's browser dependencies are published for this release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { path: StravaFeed }
      - uses: actions/checkout@v5
        with: { repository: gadominas/app-blueprints, path: app-blueprints }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Emulator dependencies
        working-directory: app-blueprints/repo-site
        run: |
          npm ci
          npm install --no-save playwright@1.56.0
      - name: Headless Chromium
        working-directory: app-blueprints/repo-site
        run: npx playwright install --with-deps chromium
      - name: Login, log-out and commenting flows
        working-directory: StravaFeed
        env:
          APP_BLUEPRINTS: ${{ github.workspace }}/app-blueprints
        run: node tests/app.test.js
