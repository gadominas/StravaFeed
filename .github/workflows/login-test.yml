# Logging in and out must always work: the login regression test runs on every push.
# It runs the real script in the Scriptable emulator from gadominas/app-blueprints (repo-site).
name: Login test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { path: StravaFeed }
      - uses: actions/checkout@v4
        with: { repository: gadominas/app-blueprints, path: app-blueprints }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Emulator dependencies
        working-directory: app-blueprints/repo-site
        run: |
          npm ci
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Login and log-out flows
        working-directory: StravaFeed
        env:
          APP_BLUEPRINTS: ${{ github.workspace }}/app-blueprints
        run: node tests/login.test.js
